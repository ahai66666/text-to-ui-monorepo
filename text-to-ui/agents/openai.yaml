interface:
  display_name: "Text to UI"
  short_description: "Build HarmonyOS PC pages from registered native components"
  default_prompt: "Use $text-to-ui to build my HarmonyOS PC tool. First choose and validate the canonical PC framework layout contract, including panes, title layer, action slots, scrolling, resize behavior, and shared layout Tokens. Then apply the required source order for every UI region: import a real HTML, React, or Vue library component when available; otherwise implement from the matching canonical contract; only when both are absent draw a custom component with shared Tokens and HarmonyOS PC rules. Components fill framework slots and never reshape the shell. Record and validate every decision before browser and Pixso QA."
