name: validate

on:
  push:
  pull_request:

jobs:
  contract-and-token-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm delivery:validate
      - run: pnpm contracts:validate
      - run: pnpm pixso:mapping:test
      - run: pnpm frameworks:validate
      - run: pnpm tokens:validate
