<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HarmonyOS Symbol · 全量图标</title>
  <style>
    @import url("../assets/design-system/tokens.colors.css");
    @import url("../assets/design-system/tokens.typography.css");
    @import url("../assets/design-system/tokens.spacing.css");
    @import url("../assets/design-system/tokens.radius.css");
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--color-text); background: var(--color-bg-subtle); font-family: var(--font-sans); }
    button, input, select { font: inherit; }
    .header { position: sticky; top: 0; z-index: 10; padding: 20px 32px; border-bottom: 1px solid var(--color-border); background: rgb(241 243 245 / 92%); backdrop-filter: blur(18px); }
    .title-row, .controls { display: flex; align-items: center; gap: 12px; }
    .title-row { justify-content: space-between; }
    h1 { margin: 0; font-size: 24px; line-height: 32px; }
    .back { color: var(--color-brand-100); text-decoration: none; }
    .summary { margin: 4px 0 16px; color: var(--color-text-muted); }
    .controls { flex-wrap: wrap; }
    .search, select { height: 40px; padding: 0 12px; border: 1px solid var(--color-border); border-radius: 8px; color: var(--color-text); background: var(--color-surface); }
    .search { min-width: 320px; flex: 1; }
    select { min-width: 180px; }
    .count { min-width: 96px; color: var(--color-text-muted); text-align: right; }
    .grid { padding: 24px 32px 48px; display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 12px; }
    .icon-card { min-width: 0; min-height: 132px; padding: 16px; display: grid; place-items: center; align-content: center; gap: 8px; border: 1px solid var(--color-border); border-radius: 12px; color: var(--color-text); background: var(--color-surface); cursor: pointer; }
    .icon-card:hover, .icon-card:focus-visible { border-color: var(--color-brand-100); outline: 0; background: var(--color-brand-05); }
    .icon-card img { width: 24px; height: 24px; }
    .icon-card strong, .icon-card small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-card strong { font-size: 13px; font-weight: 500; }
    .icon-card small { color: var(--color-text-muted); font-size: 11px; }
    .empty { grid-column: 1 / -1; padding: 80px 24px; color: var(--color-text-muted); text-align: center; }
    .toast { position: fixed; right: 24px; bottom: 24px; padding: 12px 16px; border-radius: 8px; color: white; background: var(--color-neutral-dark-90); opacity: 0; transform: translateY(12px); transition: .16s ease; }
    .toast.show { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <header class="header">
    <div class="title-row"><h1>HarmonyOS Symbol 全量图标</h1><div class="title-row"><a class="back" href="lucide-source-test.html">Lucide 原始几何</a><a class="back" href="component-gallery.html">返回组件预览</a></div></div>
    <p class="summary">433 个官方分类条目·404 个唯一 SVG·Monochrome·Regular 400·24×24</p>
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="搜索图标名称或分类" aria-label="搜索图标">
      <select id="category" aria-label="图标分类"><option value="">全部分类</option></select>
      <span class="count" id="count">0 / 404</span>
    </div>
  </header>
  <main class="grid" id="grid" aria-live="polite"></main>
  <div class="toast" id="toast" role="status">已复制图标名称</div>
  <script>
    const grid = document.querySelector('#grid');
    const search = document.querySelector('#search');
    const category = document.querySelector('#category');
    const count = document.querySelector('#count');
    const toast = document.querySelector('#toast');
    let icons = [];

    function render() {
      const query = search.value.trim().toLowerCase();
      const selectedCategory = category.value;
      const visible = icons.filter(icon => {
        const matchesQuery = !query || icon.name.toLowerCase().includes(query) || icon.categories.some(value => value.toLowerCase().includes(query));
        return matchesQuery && (!selectedCategory || icon.categories.includes(selectedCategory));
      });
      count.textContent = `${visible.length} / ${icons.length}`;
      grid.replaceChildren();
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '没有匹配的图标';
        grid.append(empty);
        return;
      }
      const fragment = document.createDocumentFragment();
      visible.forEach(icon => {
        const button = document.createElement('button');
        button.className = 'icon-card';
        button.type = 'button';
        button.title = `复制 ${icon.name}`;
        const image = document.createElement('img');
        image.src = `../assets/icons/harmonyos/${icon.file}`;
        image.alt = '';
        const name = document.createElement('strong');
        name.textContent = icon.name;
        const meta = document.createElement('small');
        meta.textContent = `${icon.unicode} · ${icon.categories.join(' / ')}`;
        button.append(image, name, meta);
        button.addEventListener('click', async () => {
          await navigator.clipboard.writeText(icon.name);
          toast.textContent = `已复制 ${icon.name}`;
          toast.classList.add('show');
          window.setTimeout(() => toast.classList.remove('show'), 1400);
        });
        fragment.append(button);
      });
      grid.append(fragment);
    }

    fetch('../assets/icons/harmonyos/catalog.json')
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(catalog => {
        icons = catalog.icons;
        const categories = [...new Set(icons.flatMap(icon => icon.categories))];
        categories.forEach(value => category.add(new Option(value, value)));
        render();
      })
      .catch(error => {
        grid.innerHTML = `<div class="empty">图标目录加载失败：${error.message}</div>`;
      });

    search.addEventListener('input', render);
    category.addEventListener('change', render);
  </script>
</body>
</html>
