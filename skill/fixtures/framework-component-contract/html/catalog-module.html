<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML 组件模块</title>
  <link rel="stylesheet" href="../shared/catalog-module.css" />
</head>
<body>
  <main id="catalog-module" class="framework-catalog-module" data-component="Catalog Module" data-variant="gallery" data-state="loading"></main>
  <script type="module">
    import { mountCatalogModule } from "../shared/catalog-module.js";
    const moduleId = new URLSearchParams(window.location.search).get("module");
    const root = document.querySelector("#catalog-module");
    root.dataset.logicalComponent = `Catalog/${moduleId || "unknown"}`;
    try { await mountCatalogModule(root, moduleId, "html"); }
    catch (error) { root.dataset.state = "error"; root.textContent = "组件模块加载失败"; }
  </script>
</body>
</html>
