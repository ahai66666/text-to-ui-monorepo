<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>静态 HTML · 组件交互</title>
    <link rel="stylesheet" href="../shared/primary-action.css" />
    <link rel="stylesheet" href="../shared/interactive-components.css" />
    <link rel="stylesheet" href="../runtime/demo-shell.css" />
  </head>
  <body>
    <main class="fixture-demo-shell">
      <p class="fixture-demo-kicker">静态 HTML · source-component · 可交互</p>
      <section data-playground="button"><button class="hm-primary-action" type="button" data-component="fixture-primary-action" data-logical-component="Button/Primary/Default" data-variant="size=medium" data-state="default">写邮件</button></section>
      <section data-playground="search"><label class="hm-search" data-component="fixture-search" data-logical-component="Search/White Surface/Default" data-variant="surface=white" data-state="default"><input class="hm-search__input" type="search" placeholder="搜索项目" aria-label="搜索项目" /><button class="hm-search__clear" type="button" hidden>清除</button></label></section>
      <section data-playground="sidebar"><nav class="hm-sidebar-nav" aria-label="邮件导航"><button class="hm-sidebar-item" type="button" data-component="fixture-sidebar-item" data-logical-component="Sidebar Item/Default" data-variant="size=medium" data-state="selected" aria-current="page">收件箱</button><button class="hm-sidebar-item" type="button" data-component="fixture-sidebar-item" data-logical-component="Sidebar Item/Default" data-variant="size=medium" data-state="default">草稿</button><button class="hm-sidebar-item" type="button" data-component="fixture-sidebar-item" data-logical-component="Sidebar Item/Default" data-variant="size=medium" data-state="default">已发送</button></nav></section>
      <section data-playground="list" class="hm-work-list" aria-label="项目列表"><button class="hm-list-item" type="button" data-component="fixture-list-item" data-logical-component="List Item/White Surface/Default" data-variant="surface=white" data-state="selected" aria-pressed="true"><span>设计系统</span><span class="hm-list-item__meta">刚刚更新</span></button><button class="hm-list-item" type="button" data-component="fixture-list-item" data-logical-component="List Item/White Surface/Default" data-variant="surface=white" data-state="default" aria-pressed="false"><span>Coremail</span><span class="hm-list-item__meta">3 个任务</span></button><button class="hm-list-item" type="button" data-component="fixture-list-item" data-logical-component="List Item/White Surface/Default" data-variant="surface=white" data-state="default" aria-pressed="false"><span>组件映射</span><span class="hm-list-item__meta">待验证</span></button></section>
      <p class="hm-component-lab__status" aria-live="polite">准备就绪</p>
    </main>
    <script>
      const component = new URLSearchParams(location.search).get("component") ?? "button";
      document.querySelectorAll("[data-playground]").forEach((section) => { section.hidden = section.dataset.playground !== component; });
      const status = document.querySelector(".hm-component-lab__status");
      const setStatus = (message) => { status.textContent = message; };
      const action = document.querySelector("[data-component='fixture-primary-action']");
      action.addEventListener("click", () => setStatus("已打开写邮件流程"));
      const search = document.querySelector(".hm-search__input");
      const clear = document.querySelector(".hm-search__clear");
      search.addEventListener("input", () => { clear.hidden = !search.value; setStatus(search.value ? `正在搜索：${search.value}` : "搜索已清除"); });
      clear.addEventListener("click", () => { search.value = ""; search.dispatchEvent(new Event("input")); search.focus(); });
      const navItems = [...document.querySelectorAll("[data-component='fixture-sidebar-item']")];
      navItems.forEach((item) => item.addEventListener("click", () => { navItems.forEach((other) => { other.dataset.state = "default"; other.removeAttribute("aria-current"); }); item.dataset.state = "selected"; item.setAttribute("aria-current", "page"); setStatus(`已切换到${item.textContent}`); }));
      const rows = [...document.querySelectorAll("[data-component='fixture-list-item']")];
      rows.forEach((row) => row.addEventListener("click", () => { rows.forEach((other) => { other.dataset.state = "default"; other.setAttribute("aria-pressed", "false"); }); row.dataset.state = "selected"; row.setAttribute("aria-pressed", "true"); setStatus(`已选择${row.firstElementChild.textContent}`); }));
      window.setFixtureState = (disabled) => { action.dataset.state = disabled ? "disabled" : "default"; action.disabled = disabled; };
    </script>
  </body>
</html>
