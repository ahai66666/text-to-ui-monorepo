<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>静态 HTML · 组件交互</title>
    <link rel="stylesheet" crossorigin href="../assets/demo-shell-CSWNtAxV.css">
  </head>
  <body>
    <main class="fixture-demo-shell">
      <p class="fixture-demo-kicker">静态 HTML · source-component · 可交互</p>
      <button class="hm-primary-action" type="button" data-component="fixture-primary-action" data-logical-component="Button/Primary/Default" data-variant="size=medium" data-state="default">写邮件</button>
      <div class="hm-component-lab">
        <nav class="hm-sidebar-nav" aria-label="邮件导航">
          <button class="hm-sidebar-item" type="button" data-component="fixture-sidebar-item" data-logical-component="Sidebar Item/Default" data-variant="size=medium" data-state="selected" aria-current="page">收件箱</button>
          <button class="hm-sidebar-item" type="button" data-component="fixture-sidebar-item" data-logical-component="Sidebar Item/Default" data-variant="size=medium" data-state="default">草稿</button>
          <button class="hm-sidebar-item" type="button" data-component="fixture-sidebar-item" data-logical-component="Sidebar Item/Default" data-variant="size=medium" data-state="default">已发送</button>
        </nav>
        <section class="hm-work-list" aria-label="收件箱列表">
          <label class="hm-search" data-component="fixture-search" data-logical-component="Search/White Surface/Default" data-variant="surface=white" data-state="default"><input class="hm-search__input" type="search" placeholder="搜索项目" aria-label="搜索项目" /><button class="hm-search__clear" type="button" hidden>清除</button></label>
          <button class="hm-list-item" type="button" data-component="fixture-list-item" data-logical-component="List Item/White Surface/Default" data-variant="surface=white" data-state="selected" aria-pressed="true"><span>设计系统</span><span class="hm-list-item__meta">刚刚更新</span></button>
          <button class="hm-list-item" type="button" data-component="fixture-list-item" data-logical-component="List Item/White Surface/Default" data-variant="surface=white" data-state="default" aria-pressed="false"><span>Coremail</span><span class="hm-list-item__meta">3 个任务</span></button>
          <button class="hm-list-item" type="button" data-component="fixture-list-item" data-logical-component="List Item/White Surface/Default" data-variant="surface=white" data-state="default" aria-pressed="false"><span>组件映射</span><span class="hm-list-item__meta">待验证</span></button>
          <p class="hm-component-lab__status" aria-live="polite">准备就绪</p>
        </section>
      </div>
    </main>
    <script>
      const action = document.querySelector("[data-component='fixture-primary-action']");
      const search = document.querySelector(".hm-search__input");
      const clear = document.querySelector(".hm-search__clear");
      const navItems = [...document.querySelectorAll("[data-component='fixture-sidebar-item']")];
      const rows = [...document.querySelectorAll("[data-component='fixture-list-item']")];
      const status = document.querySelector(".hm-component-lab__status");
      const setStatus = (message) => { status.textContent = message; };
      action.addEventListener("click", () => setStatus("已打开写邮件流程"));
      navItems.forEach((item) => item.addEventListener("click", () => { navItems.forEach((other) => { other.dataset.state = "default"; other.removeAttribute("aria-current"); }); item.dataset.state = "selected"; item.setAttribute("aria-current", "page"); setStatus(`已切换到${item.textContent}`); }));
      rows.forEach((row) => row.addEventListener("click", () => { rows.forEach((other) => { other.dataset.state = "default"; other.setAttribute("aria-pressed", "false"); }); row.dataset.state = "selected"; row.setAttribute("aria-pressed", "true"); setStatus(`已选择${row.firstElementChild.textContent}`); }));
      search.addEventListener("input", () => { const query = search.value; clear.hidden = !query; rows.forEach((row) => { row.hidden = !row.textContent.includes(query); }); });
      clear.addEventListener("click", () => { search.value = ""; search.dispatchEvent(new Event("input")); search.focus(); });
      window.setFixtureState = (disabled) => { action.dataset.state = disabled ? "disabled" : "default"; action.disabled = disabled; };
    </script>
  </body>
</html>
